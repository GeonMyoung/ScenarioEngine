name: Workflow handoff checks

on:
  pull_request:
    paths:
      - tools/workflow.py
      - tests/test_workflow.py
      - .github/workflows/workflow-tools.yml
  push:
    branches: [main]
    paths:
      - tools/workflow.py
      - tests/test_workflow.py
      - .github/workflows/workflow-tools.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test durable handoff records
        run: python -m unittest discover -s tests -p test_workflow.py -v
